scripts:
  - name: Startup
    command: node scripts/setup-replica-plugin.mjs --startup
    triggers:
      - session.create
  - name: Dev
    command: npm run dev
  - name: Preview
    command: npm run preview

server_ready_pattern: '(?i)Local:\s+(https?://\S+)'
auto_open_in_browser: true

automation:
  remote_control: false
