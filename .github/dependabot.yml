version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/hub"
      - "/actions/build"
      - "/starter"
      - "/scripts"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
