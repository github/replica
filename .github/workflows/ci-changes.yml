name: CI selection

on:
  workflow_call:
    outputs:
      hub:
        description: Run the complete Hub suite
        value: ${{ jobs.changes.outputs.hub }}
      build_action:
        description: Run the build-action suite
        value: ${{ jobs.changes.outputs.build_action }}

permissions:
  contents: read

jobs:
  changes:
    name: Select affected suites
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.select.outputs.hub }}
      build_action: ${{ steps.select.outputs.build_action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          working-directory: hub
      - run: node --test scripts/select-ci-suites.test.mjs
      - run: ruby scripts/check-ci-workflows.rb
      - id: select
        run: node scripts/select-ci-suites.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
