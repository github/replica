name: Dependency age

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Dependency age
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          working-directory: hub
      - run: bin/check-dependency-age
        env:
          DEPENDENCY_AGE_ROOT: ..
          DEPENDENCY_AGE_EXCLUDED_PATHS: starter
          # crass 1.0.8 fixes GHSA-pq4g-8rxf-4g29. Remove after 2026-10-28T21:35:16Z.
          DEPENDENCY_AGE_EXCEPTIONS: bundler:crass@1.0.8
