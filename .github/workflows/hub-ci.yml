name: Hub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: hub

jobs:
  check:
    name: Hub ${{ matrix.command == 'test' && 'unit tests' || matrix.command == 'test:database' && 'database tests' || matrix.command }}${{ matrix.node == 26 && ' (Node 26)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        command:
          [
            lint,
            typecheck,
            test,
            "test:entra-setup",
            build,
            storybook:build,
            "db:validate",
            "test:database",
          ]
    services:
      postgres:
        image: ${{ matrix.command == 'test:database' && 'postgres:18.6-bookworm' || '' }}
        env:
          POSTGRES_USER: replica
          POSTGRES_PASSWORD: replica
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U replica -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --engine-strict
      - run: npm run ${{ matrix.command }}
        env:
          TEST_DATABASE_URL: ${{ matrix.command == 'test:database' && 'postgresql://replica:replica@127.0.0.1:5432/postgres' || '' }}

  integration:
    name: Controls and extension tests${{ matrix.node == 26 && ' (Node 26)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            hub/package-lock.json
            actions/build/package-lock.json
      - run: npm ci --engine-strict
      - run: npm ci --ignore-scripts --omit=dev --engine-strict
        working-directory: actions/build
      - run: ../actions/build/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run controls:test
      - name: Test extension with pinned Chromium
        run: |
          REPLICA_CHROMIUM_PATH="$(node -p 'require("../actions/build/node_modules/playwright").chromium.executablePath()')"
          export REPLICA_CHROMIUM_PATH
          npm run extension:test
      - run: npm run controls:assets:check
      - run: npm run controls:schema:check
      - run: npm run extension:assets:check
