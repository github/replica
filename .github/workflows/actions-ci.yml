name: Build action CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build action suite${{ matrix.node == 26 && ' (Node 26)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: actions/build/package-lock.json
      - run: npm ci --ignore-scripts --engine-strict
        working-directory: actions/build
      - run: npm run lint
        working-directory: actions/build
      - run: actions/build/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix actions/build
      - name: Prepare composite action fixture
        if: ${{ matrix.node == 24 }}
        run: cp actions/build/test/fixture/package.json actions/build/test/fixture/package-lock.json actions/build/test/fixture/fixture-build.mjs .
      - uses: ./actions/build
        if: ${{ matrix.node == 24 }}
