name: Build action CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build action suite${{ matrix.node == 26 && ' (Node 26)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: actions/build/package-lock.json
      - run: npm ci --ignore-scripts --engine-strict
        working-directory: actions/build
      - run: npm run lint
        working-directory: actions/build
      - run: actions/build/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix actions/build

  publish:
    name: Build action publish job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build composite action fixture with its own build
        run: |
          cp actions/build/test/fixture/package.json actions/build/test/fixture/package-lock.json actions/build/test/fixture/fixture-build.mjs .
          npm ci --ignore-scripts
          npm run build
      - uses: ./actions/build/publish

  screenshots:
    name: Build action screenshot job
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/build/screenshots
