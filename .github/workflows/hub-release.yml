name: Hub release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare release metadata
    if: startsWith(github.event.release.tag_name, 'hub-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
      revision: ${{ steps.release.outputs.revision }}
      tags: ${{ steps.metadata.outputs.tags }}
      labels: ${{ steps.metadata.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read release version
        id: release
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^hub-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${identifier}(\\.${identifier})*)?$"
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "Hub release tag must use semantic versioning, such as hub-v1.2.3." >&2
            exit 1
          fi

          version=${RELEASE_TAG#hub-v}
          stable=true
          tag_prerelease=false
          if [[ "$version" == *-* ]]; then
            stable=false
            tag_prerelease=true
          fi
          if [[ "$RELEASE_PRERELEASE" != "$tag_prerelease" ]]; then
            echo "The tag and GitHub prerelease setting must agree." >&2
            exit 1
          fi

          {
            echo "stable=$stable"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/github/replica-hub
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

  build:
    name: Build release image (${{ matrix.architecture }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: hub
          build-contexts: learning=packages/learning
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=ghcr.io/github/replica-hub,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          build-args: |
            REPLICA_IMAGE_REVISION=${{ needs.prepare.outputs.revision }}
            REPLICA_IMAGE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Build did not return a SHA-256 image digest" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish container and deployment bundle
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
      - name: Publish multiarchitecture image
        env:
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then
              echo "Release metadata contains an empty image tag" >&2
              exit 1
            fi
            tag_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          refs=()
          for architecture in amd64 arm64; do
            files=("$RUNNER_TEMP/digests/image-digest-$architecture/"*)
            if [[ "${#files[@]}" != 1 || ! -f "${files[0]}" ]]; then
              echo "Expected exactly one image digest for $architecture" >&2
              exit 1
            fi
            digest=$(basename "${files[0]}")
            if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Invalid image digest for $architecture" >&2
              exit 1
            fi
            refs+=("ghcr.io/github/replica-hub@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
      - name: Package deployment bundle
        run: |
          mkdir -p hub/tmp/release
          tar -czf hub/tmp/release/replica-deploy.tar.gz -C hub/deploy compose.yml replica
          cd hub/tmp/release
          sha256sum replica-deploy.tar.gz >replica-deploy.tar.gz.sha256

      - name: Upload deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            hub/tmp/release/replica-deploy.tar.gz \
            hub/tmp/release/replica-deploy.tar.gz.sha256 \
            --clobber
