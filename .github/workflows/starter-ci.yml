name: Starter CI

on:
  pull_request:
    paths:
      - ".github/workflows/starter-ci.yml"
      - "starters/**"
      - "scripts/check-starter.sh"
      - "scripts/starter-catalog.sh"
      - "scripts/starter-catalog.test.mjs"
      - "scripts/starter-ci-matrix.sh"
      - "scripts/create-prototype-repo.sh"
      - "scripts/create-prototype-repo.test.mjs"
      - "scripts/shadcn-starter.test.mjs"
      - "scripts/setup-replica-plugin.test.mjs"
      - "scripts/install-starter.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/starter-ci.yml"
      - "starters/**"
      - "scripts/check-starter.sh"
      - "scripts/starter-catalog.sh"
      - "scripts/starter-catalog.test.mjs"
      - "scripts/starter-ci-matrix.sh"
      - "scripts/create-prototype-repo.sh"
      - "scripts/create-prototype-repo.test.mjs"
      - "scripts/shadcn-starter.test.mjs"
      - "scripts/setup-replica-plugin.test.mjs"
      - "scripts/install-starter.sh"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      starters: ${{ steps.catalog.outputs.starters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: catalog
        run: |
          starters="$(bash scripts/starter-ci-matrix.sh)"
          echo "starters=$starters" >> "$GITHUB_OUTPUT"
  tooling:
    name: Starter tooling (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test scripts/create-prototype-repo.test.mjs scripts/shadcn-starter.test.mjs scripts/setup-replica-plugin.test.mjs scripts/select-ci-suites.test.mjs
  test:
    name: Starter checks${{ matrix.starter.id != 'minimal' && format(' ({0})', matrix.starter.id) || '' }}${{ matrix.node == 26 && ' (Node 26)' || '' }}
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        starter: ${{ fromJSON(needs.catalog.outputs.starters) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.starter.directory }}/package*.json
      - run: bash scripts/check-starter.sh "${{ matrix.starter.id }}" "$RUNNER_TEMP/prototype"
        env:
          # Bot commit identity: https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
