name: Learning CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Learning checks${{ matrix.node == 26 && ' (Node 26)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_USER: replica
          POSTGRES_PASSWORD: replica
          POSTGRES_DB: replica_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U replica -d replica_learning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/learning/package-lock.json
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run schema:check
      - run: npm test
      - run: npm run test:database
        env:
          REPLICA_LEARNING_TEST_DATABASE_URL: postgresql://replica:replica@127.0.0.1:5432/replica_learning_test
      - run: npm run demo
      - run: npm run demo:agent-memory-repo
      - name: Brand check environment tests
        if: matrix.node == 24
        working-directory: packages/learning/environments/brand-check
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/python -m unittest discover -s tests -t .
