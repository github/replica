name: Replica build
description: Build a Replica prototype and upload its package, with screenshots inline or in a later job

inputs:
  base-path:
    description: Path where the compiled app is mounted during screenshot capture; configure the app's build base separately
    required: false
    default: /
  build-only:
    description: Build static output without packaging, uploading, or capturing screenshots; publish it with a later actions/build/publish step
    required: false
    default: "false"
  skip-build:
    description: Use static output built by earlier steps in this job instead of running npm
    required: false
    default: "false"
  output-directory:
    description: Workspace-relative directory containing the static website and index.html
    required: false
    default: dist
  screenshots:
    description: Upload one package after capturing screenshots in this job (inline), or upload the dist package immediately for a later actions/build/screenshots job (separate)
    required: false
    default: inline

runs:
  using: composite
  steps:
    - name: Check action options
      env:
        REPLICA_BUILD_ONLY: ${{ inputs.build-only }}
        REPLICA_SKIP_BUILD: ${{ inputs.skip-build }}
        REPLICA_SCREENSHOTS: ${{ inputs.screenshots }}
      run: |
        if [[ "$REPLICA_BUILD_ONLY" != "true" && "$REPLICA_BUILD_ONLY" != "false" ]]; then
          echo "::error::build-only must be true or false."
          exit 1
        fi
        if [[ "$REPLICA_SKIP_BUILD" != "true" && "$REPLICA_SKIP_BUILD" != "false" ]]; then
          echo "::error::skip-build must be true or false."
          exit 1
        fi
        if [[ "$REPLICA_SCREENSHOTS" != "inline" && "$REPLICA_SCREENSHOTS" != "separate" ]]; then
          echo "::error::screenshots must be inline or separate."
          exit 1
        fi
      shell: bash

    - name: Use Node.js 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Check checkout credentials
      run: node "$GITHUB_ACTION_PATH/scripts/validate-checkout/index.mjs" --root "$GITHUB_WORKSPACE"
      shell: bash

    - name: Check required npm files and build script
      if: inputs.skip-build != 'true'
      run: node "$GITHUB_ACTION_PATH/scripts/validate-repository/index.mjs" --root "$GITHUB_WORKSPACE"
      shell: bash

    - name: Build prototype as a non-root user in a Node container
      if: inputs.skip-build != 'true'
      run: |
        docker run --rm \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          --pids-limit=512 \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp \
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
          --workdir /workspace \
          node:24-bookworm@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0 \
          sh -lc 'npm ci && npm run build'
      shell: bash

    - name: Prepare static output in runner temporary storage
      if: inputs.build-only != 'true'
      env:
        REPLICA_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        node "$GITHUB_ACTION_PATH/scripts/prepare-build-output/index.mjs" \
          --root "$GITHUB_WORKSPACE" \
          --output-directory "$REPLICA_OUTPUT_DIRECTORY" \
          --output "$RUNNER_TEMP/replica-build-root"
      shell: bash

    - name: Create Replica dist package
      if: inputs.build-only != 'true' && inputs.screenshots == 'separate'
      run: node "$GITHUB_ACTION_PATH/scripts/create-dist-package/index.mjs" --root "$RUNNER_TEMP/replica-build-root" --config-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/replica-build-v1"
      shell: bash

    - name: Upload Replica dist package
      if: inputs.build-only != 'true' && inputs.screenshots == 'separate'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: replica-build-v1
        path: ${{ runner.temp }}/replica-build-v1/
        if-no-files-found: error
        retention-days: 3
        include-hidden-files: true

    - name: Install browser-check dependencies
      if: inputs.build-only != 'true' && inputs.screenshots == 'inline'
      run: npm ci --ignore-scripts --omit=dev
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Install Chromium
      if: inputs.build-only != 'true' && inputs.screenshots == 'inline'
      run: '"$GITHUB_ACTION_PATH/node_modules/.bin/playwright" install --with-deps chromium'
      shell: bash

    - name: Capture screenshots
      if: inputs.build-only != 'true' && inputs.screenshots == 'inline'
      env:
        REPLICA_BASE_PATH: ${{ inputs.base-path }}
      run: node "$GITHUB_ACTION_PATH/scripts/capture-screenshots/index.mjs" --root "$RUNNER_TEMP/replica-build-root" --config-root "$GITHUB_WORKSPACE" --screenshots "$RUNNER_TEMP/replica-screenshots" --base-path "$REPLICA_BASE_PATH"
      shell: bash

    - name: Create Replica package
      if: inputs.build-only != 'true' && inputs.screenshots == 'inline'
      run: node "$GITHUB_ACTION_PATH/scripts/create-package/index.mjs" --root "$RUNNER_TEMP/replica-build-root" --screenshots "$RUNNER_TEMP/replica-screenshots" --output "$RUNNER_TEMP/replica-build-v1"
      shell: bash

    - name: Upload Replica package
      if: inputs.build-only != 'true' && inputs.screenshots == 'inline'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: replica-build-v1
        path: ${{ runner.temp }}/replica-build-v1/
        if-no-files-found: error
        retention-days: 3
        include-hidden-files: true
