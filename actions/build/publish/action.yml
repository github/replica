name: Replica publish
description: Package static prototype output built by earlier steps and upload it as replica-build-v1, without npm or a browser

inputs:
  output-directory:
    description: Workspace-relative directory containing the static website and index.html
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Use Node.js 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Check checkout credentials
      run: node "$GITHUB_ACTION_PATH/../scripts/validate-checkout/index.mjs" --root "$GITHUB_WORKSPACE"
      shell: bash

    - name: Prepare static output in runner temporary storage
      env:
        REPLICA_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        node "$GITHUB_ACTION_PATH/../scripts/prepare-build-output/index.mjs" \
          --root "$GITHUB_WORKSPACE" \
          --output-directory "$REPLICA_OUTPUT_DIRECTORY" \
          --output "$RUNNER_TEMP/replica-build-root"
      shell: bash

    - name: Create Replica dist package
      run: node "$GITHUB_ACTION_PATH/../scripts/create-dist-package/index.mjs" --root "$RUNNER_TEMP/replica-build-root" --config-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/replica-build-v1"
      shell: bash

    - name: Upload Replica dist package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: replica-build-v1
        path: ${{ runner.temp }}/replica-build-v1/
        if-no-files-found: error
        retention-days: 3
        include-hidden-files: true
