name: Replica publish
description: Package static output, retain its GitHub artifact, and optionally push it to Hub without npm or a browser

inputs:
  output-directory:
    description: Workspace-relative directory containing the static website and index.html
    required: false
    default: dist
  hub-url:
    description: Hub origin to publish to; omit for artifact-only webhook and polling import
    required: false
    default: ""
  hub-retries:
    description: Additional upload attempts for transient failures (0 to 5)
    default: "2"
  hub-retry-delay:
    description: Initial backoff in seconds, doubled up to 60 seconds (0 to 60)
    default: "15"
  hub-timeout:
    description: Timeout in seconds for each upload attempt (1 to 300)
    default: "180"

runs:
  using: composite
  steps:
    - name: Use Node.js 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Check checkout credentials
      run: node "$GITHUB_ACTION_PATH/../scripts/validate-checkout/index.mjs" --root "$GITHUB_WORKSPACE"
      shell: bash

    - name: Prepare static output in runner temporary storage
      env:
        REPLICA_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        node "$GITHUB_ACTION_PATH/../scripts/prepare-build-output/index.mjs" \
          --root "$GITHUB_WORKSPACE" \
          --output-directory "$REPLICA_OUTPUT_DIRECTORY" \
          --output "$RUNNER_TEMP/replica-build-root"
      shell: bash

    - name: Create Replica dist package
      run: node "$GITHUB_ACTION_PATH/../scripts/create-dist-package/index.mjs" --root "$RUNNER_TEMP/replica-build-root" --config-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/replica-build-v1"
      shell: bash

    - name: Upload Replica dist package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: replica-build-v1
        path: ${{ runner.temp }}/replica-build-v1/
        if-no-files-found: error
        retention-days: 3
        include-hidden-files: true

    - name: Push dist package to Hub
      if: inputs.hub-url != ''
      env:
        REPLICA_HUB_URL: ${{ inputs.hub-url }}
        REPLICA_HUB_RETRIES: ${{ inputs.hub-retries }}
        REPLICA_HUB_RETRY_DELAY: ${{ inputs.hub-retry-delay }}
        REPLICA_HUB_TIMEOUT: ${{ inputs.hub-timeout }}
      run: node "$GITHUB_ACTION_PATH/../scripts/push-to-hub/index.mjs" build "$RUNNER_TEMP/replica-build-v1"
      shell: bash
