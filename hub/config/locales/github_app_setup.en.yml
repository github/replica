en:
  github_app_setup:
    show:
      page_title: Set up Replica Hub
      heading: Connect GitHub.
      description: Enter the deployment bootstrap secret to create or connect this Hub's GitHub App.
      secret_label: Bootstrap secret
      organization_label: GitHub organization login (optional)
      organization_hint: Leave blank to create the App under your personal account.
      submit: Continue
    register:
      page_title: Create the GitHub App
      heading: Connect Replica Hub to GitHub.
      description: Replica Hub uses a private GitHub App to find the prototype branches you want to share, build them, and report their status back to GitHub.
      access: You choose which repositories it can access. Replica Hub can read their code and workflow results. A repository writer can also ask Hub to open a pull request that installs the Replica workflow.
      submit: Create the App on GitHub
      manual: Create manually or connect an existing App
    manual:
      page_title: Connect an existing GitHub App
      heading: Connect your GitHub App.
      description: Configure the App on your GitHub host, install it on the intended account, then enter its credentials here. Hub will not change the App's GitHub settings.
      submit: Verify and connect this installation
      complete: The App and approved installation are connected. Enroll a Hub operator at /operator/enrollment, verify GitHub sign-in, and check a supported webhook delivery. Connection does not verify the OAuth client secret or webhook delivery.
      confirm: I approve this App and installation for this Hub. I have checked the installation's account and selected repositories, configured the webhook, and understand that App credentials and webhook settings affect every installation of this App.
      key_label: Private keys - PEM file
      key_hint: In the App's settings, open Credentials (or General in older layouts), then Private keys and Generate a private key. Upload the downloaded PEM file (at most 16 KiB). Credentials are never shown again; re-enter them after an error.
      invalid_key: Upload a PEM private key of at most 16 KiB.
      failed: Hub could not connect the App. Check the credentials, App and installation IDs, active installation status, and GitHub connectivity. No configuration was saved. Re-enter the credentials and try again.
      errors:
        invalid_credentials: Check that the App ID, Client ID, client secret, webhook secret, and installation ID are valid and within the stated limits.
        invalid_private_key: Upload a PEM private key generated for this GitHub App.
        app_mismatch: The App ID and Client ID must belong to the same GitHub App. Copy both from that App's settings.
        github_authentication_failed: GitHub rejected the App authentication. Check the App ID, Client ID, and private key from the same App.
        github_failed: Hub could not verify the App and installation with GitHub. Check the installation ID, active installation status, selected repositories, and GitHub connectivity.
        save_failed: Hub verified the App and installation but could not save the connection. Check Hub's database and try again.
      settings:
        name: GitHub App name (choose a unique name)
        homepage: Homepage URL
        callback: Callback URL
        webhook: Webhook URL
      permissions:
        administration: Repository permissions - Administration
        actions: Repository permissions - Actions
        contents: Repository permissions - Contents
        pull_requests: Repository permissions - Pull requests
        workflows: Repository permissions - Workflows
      levels:
        read: Read-only
        write: Read and write
      instructions:
        - title: 1. General
          body: On your GitHub host, open your account or organization's Settings, Developer settings, GitHub Apps, then New GitHub App. For an existing App, open its settings instead. Use the values below. Leave Setup URL blank, and leave Request user authorization (OAuth) during installation and Redirect on update unchecked. Leave user authorization token expiration enabled. Return here after installing.
        - title: 2. Permissions & events
          body: Set the repository permissions below. Under Subscribe to events, select Push and Workflow run. GitHub also delivers installation and installation-repository changes. Save the settings. For an existing installation, its account administrator must approve any increased permissions; Hub access cannot grant that authority.
        - title: 3. Webhook and visibility
          body: Enable Active under Webhook, use the Webhook URL above, generate a long random Webhook secret, and keep SSL verification enabled. Enter the same secret below. GitHub must be able to reach Hub over HTTPS. A private App restricts who can authorize it; cross-account installation and team sign-in may require a public App, subject to GitHub policy. Public visibility does not make repositories public. Do not reuse an App whose webhook serves another integration; its URL and secret are shared across all installations.
        - title: 4. Install App
          body: Choose Install App, select the intended account, and choose Only select repositories. Select the prototype repositories for this Hub. If approval is required, an authorized administrator must complete it. Copy the numeric installation ID from the resulting installation settings URL (the number after /installations/). Hub connects only this installation and will not automatically select a replacement.
        - title: 5. Credentials and confirmation
          body: In the App's settings, copy App ID and Client ID. Open Credentials (or General in older layouts) to generate a client secret and private key. Enter those values below, together with the webhook secret and installation ID. Hub verifies App and installation identity and reads the installation's repositories before saving. This verifies the private key, not the OAuth client secret, webhook delivery, or end-user sign-in; verify those separately after connection. Setup expires after 15 minutes.
      fields:
        - name: app_id
          label: App ID
          hint: Copy App ID from the App's settings, not its installation ID.
          secret: false
        - name: client_id
          label: Client ID
          hint: Copy Client ID from the same App's settings.
          secret: false
        - name: client_secret
          label: Client secrets - generated secret
          hint: In Credentials (or General in older layouts), generate a client secret and copy it here (at most 4 KiB).
          secret: true
        - name: webhook_secret
          label: Webhook secret
          hint: Enter the same random secret saved in the App's Webhook settings (at most 4 KiB).
          secret: true
        - name: installation_id
          label: Installation ID
          hint: Copy the numeric ID from the intended account's installation settings URL.
          secret: false
    install:
      page_title: GitHub setup complete
      heading: GitHub is connected.
      description: You're ready to start building and reviewing prototypes.
