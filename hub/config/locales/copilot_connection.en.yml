en:
  copilot_connection:
    heading: Copilot
    description: A Hub administrator connects Copilot once for the whole Hub. Hub then asks Copilot to suggest learnings from prototype review comments, with a token that the person who runs Hub provides, so it works while everyone is signed out.
    connected_status: Copilot is connected
    disconnected_status: Copilot is not connected
    connected_by: "%{login} connected Copilot on %{date}."
    verified: "Copilot last answered on %{date}."
    usage: "In the last 30 days, Learnings used %{credits} AI credits in %{requests}."
    requests:
      one: 1 Copilot request
      other: "%{count} Copilot requests"
    refused: "Copilot refused the token on %{date}, so Hub stopped looking for learnings. Replace REPLICA_COPILOT_TOKEN and restart Hub, or check the token again."
    no_token: Hub has no Copilot token. The person who runs Hub sets REPLICA_COPILOT_TOKEN to a fine-grained personal access token whose only permission is Copilot requests, then restarts Hub.
    empty: Learnings stays off until a Hub administrator connects Copilot.
    verification: This change requires GitHub verification within the last five minutes on this browser. If verification is required, Hub continues your confirmed change after it succeeds.
    connect:
      label: Connect Copilot
      consequence: Hub will ask Copilot, with the configured token, to read new review comments from every repository on this Hub and suggest learnings, including while you are signed out. Copilot never sees who wrote a comment. The usage counts toward the Copilot plan of the token's owner. Hub checks the token with Copilot first, and never stores or shows it.
      confirm: I understand that Hub will use this Copilot token for this Hub.
    reconnect:
      label: Check the token again
    disconnect:
      label: Disconnect Copilot
      consequence: Hub stops looking for learnings and turns off Learnings for every repository. Hub keeps every learning and decision, so connecting again restores them. The token stays where the person who runs Hub keeps it; they can revoke it on GitHub.
      confirm: I understand and confirm disconnecting Copilot for this Hub.
    connected: Copilot is connected.
    disconnected: Copilot is disconnected.
    no_access: Only Hub administrators can view or change the Copilot connection.
    errors:
      not_authorized: Your account is not a current Hub administrator. Copilot was not changed.
      confirmation_required: Confirm the Copilot change explicitly. Copilot was not changed.
      not_connected: Copilot is not connected, so there is nothing to disconnect.
      connection_changed: The Copilot connection changed while Hub checked the token. Hub did not change it. Review the current connection before trying again.
      no_token: Hub has no Copilot token, so Copilot was not connected. Set REPLICA_COPILOT_TOKEN and restart Hub.
      refused: Copilot refused the token, so Copilot was not connected. Check that the token's owner has Copilot and that the token has the Copilot requests permission.
      unavailable: Hub could not reach Copilot to check the token, so Copilot was not connected. Try again later.
      not_installed: Hub could not check the token because replica-learning or a package it needs is not installed here. Run bin/setup, then try again.
