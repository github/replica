en:
  github_app:
    heading: GitHub App
    description: Administer this Hub's GitHub App. This does not grant access to repositories.
    not_configured: No GitHub App is configured. Initial setup still requires the deployment bootstrap secret.
    admins: Hub administrators
    audit: Security audit
    cancel: Cancel
    verification: GitHub must have verified this browser's account within the last five minutes. If verification is required, Hub temporarily encrypts your submitted settings and continues your confirmed change after it succeeds.
    identity: "App %{app_id} - %{owner} (%{owner_type}, identity %{owner_id})"
    installation: "Installation %{installation_id}: %{state}"
    installation_required: "Install this App in the %{owner} account and select its repositories. Hub checks GitHub automatically and restores access after installation."
    busy: A webhook update is in progress. Wait for it to finish before changing the App.
    credentials:
      heading: Replace App credentials
      description: Generate a replacement client secret and PEM private key in the same App's GitHub settings. Hub checks the key's App and owner identity. It cannot verify the client secret until a successful GitHub sign-in.
      secret: New client secret
      key: New private key file (.pem)
      limits: The client secret may contain at most 4 KiB and the private key file at most 16 KiB. Saved secrets are never displayed.
      confirm: I confirm these replacements belong to the same GitHub App. Pending OAuth checks and fresh proof will end, but live Sessions and canvas connections will remain.
      submit: Save replacement credentials
      saved: Credentials saved. Check GitHub sign-in before revoking old credentials at GitHub. New verification is required for sensitive actions.
    webhook:
      heading: Webhook secret rotation
      description: Hub generates the secret and updates GitHub directly. No secret is displayed or copied through this page.
      idle: Only the current webhook secret is accepted.
      pending: GitHub has not confirmed the update. Both saved secrets remain accepted. Retry sends the same replacement, not a third secret.
      confirmed: GitHub confirmed the replacement. Both secrets remain accepted until you finish the overlap.
      start: Start webhook rotation
      retry: Retry saved webhook update
      finish: Stop accepting the old secret
      confirm_start: I confirm that Hub should generate and install a replacement webhook secret while accepting the previous secret.
      confirm_retry: I confirm that Hub should resend its saved replacement to GitHub. Both secrets will remain accepted.
      confirm_finish: I confirm that delayed deliveries signed with the old secret will be rejected after this change.
      finished: The previous webhook secret is no longer accepted.
    reset:
      heading: Reset local GitHub App?
      description: Remove the local App configuration and sign everyone out. The remote GitHub App will not be uninstalled or deleted.
      consequences: Hub will revoke canvas connections, discard pending approvals and OAuth checks, and mark repositories unavailable. Users, administrator roles, Builds, files, reviews, analytics and audit history remain. Queue history is not deleted and already-sent work cannot be undone.
      shares: Public share records are retained. Links stop working while the App or repository is unavailable. Unrevoked links may resume only if the same repository is installed again and the existing sharing policy permits them. Reset does not enable sharing or restore permanently revoked links.
      phrase: Type "delete local GitHub App configuration"
      confirm: I have the deployment bootstrap secret and access to create/install a replacement App. I understand everyone will be signed out and canvas connections must be approved again.
      submit: Delete local App configuration
      complete: Local App reset completed. Everyone is signed out and canvas connections are revoked. The remote App and retained data are unchanged. A server owner must use the deployment bootstrap secret at /setup to configure a replacement App.
      disconnect_failed: Local App reset completed and database credentials were revoked, but Hub could not notify every live connection. Ask the server owner to check live updates. Use the deployment bootstrap secret at /setup to configure a replacement App.
    errors:
      not_authorized: Your account is no longer a Hub administrator. App administration is not available.
      not_configured: The GitHub App is no longer configured.
      confirmation_required: Review the current App and deliberately confirm the requested action.
      state_changed: The App changed while this request was in progress. Review its current state and confirm again.
      busy: A webhook update is in progress. No additional App operation was started.
      webhook_pending: GitHub must confirm the saved replacement before the previous secret can be removed.
      bootstrap_missing: The deployment bootstrap secret is not configured. Ask the server owner to restore it before resetting the App.
      invalid_credentials: Hub could not validate these replacements for the same App. Enter the client secret and upload a valid PEM private key again.
      github_failed: GitHub could not confirm the operation. Credentials were not replaced. A pending webhook rotation retains both secrets; review its status before retrying.
      save_failed: Hub could not save the operation. Review the current App state before retrying; an external GitHub update cannot be rolled back by Hub.
