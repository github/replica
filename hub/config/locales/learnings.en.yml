en:
  learnings:
    heading: Learnings
    description: Hub reads this repository's prototype review comments, asks Copilot which points keep coming up, and suggests learnings. Agents that build prototypes here get the learnings you accept.
    status:
      scheduled: "Hub looks for learnings once a day when there are new comments, using the Copilot connection @%{login} made."
      local: Local development looks for learnings only when you ask. Hub asks Copilot as whoever is signed in to Copilot on this machine.
      refused: "Copilot refused Hub's Copilot token on %{date}, so Hub stopped looking for learnings until the token is replaced or checked again on the Copilot page. You can still decide on suggestions, and agents still get accepted learnings."
      no_token: Hub has no Copilot token, so it stopped looking for learnings until the person who runs Hub sets REPLICA_COPILOT_TOKEN. You can still decide on suggestions, and agents still get accepted learnings.
      queued: Hub will look for learnings shortly.
      running: Hub is looking for learnings now.
      usage: "Copilot used %{credits} AI credits for this repository in the last 30 days."
    organization:
      status:
        refused: "Copilot refused Hub's GitHub App on %{date}, so Hub stopped looking for learnings until a Hub administrator checks Copilot again on the Copilot page. You can still decide on suggestions, and agents still get accepted learnings."
        no_token: Organization billing needs Hub's GitHub App installed on an organization, so Hub stopped looking for learnings. You can still decide on suggestions, and agents still get accepted learnings.
        unconfirmed: Hub stopped looking for learnings until a Hub administrator connects Copilot again on the Copilot page to confirm organization billing. You can still decide on suggestions, and agents still get accepted learnings.
    run:
      label: Find learnings now
    runs:
      requested: Hub will look for learnings shortly. Refresh this page to see the result.
      copilot_refused: Hub cannot use Copilot now, so it cannot look for learnings. A Hub administrator can see why on the Copilot page.
      heading: Recent runs
      empty: Hub has not looked for learnings in this repository yet.
      columns:
        started: Started
        started_by: Started by
        result: Result
        usage: Copilot usage
      daily: Daily
      requested_by: "@%{login}"
      requested_by_someone: A repository administrator
      states:
        queued: Waiting
        running: Running
        succeeded: Finished
        failed: Failed
      comments:
        zero: No new comments
        one: 1 new comment
        other: "%{count} new comments"
      labeled:
        zero: none labeled
        one: 1 labeled
        other: "%{count} labeled"
      suggestions:
        zero: no new suggestions
        one: 1 new suggestion
        other: "%{count} new suggestions"
      remaining:
        one: 1 comment left for the next run
        other: "%{count} comments left for the next run"
      suggestions_remaining:
        one: 1 suggestion left for the next run
        other: "%{count} suggestions left for the next run"
      usage: "%{credits} AI credits in %{requests}"
      requests:
        one: 1 request
        other: "%{count} requests"
      no_usage: None
    suggestions:
      heading: Suggestions
      empty: No suggestions yet. Hub suggests a learning when at least two reviewers raise the same point on two prototypes.
      empty_local: No suggestions yet. In local development, Hub suggests a learning when the same point comes up on two prototypes.
      support: "Raised by %{reviewers} on %{prototypes}"
      reviewers:
        one: 1 reviewer
        other: "%{count} reviewers"
      prototypes:
        one: 1 prototype
        other: "%{count} prototypes"
      replaces: Accepting this replaces the guidance listed below.
      replacement_unavailable: This learning's wording is not available for review.
      evidence: What reviewers said
      contradictions: What reviewers disagreed with
      deleted: The author deleted this comment.
      other_evidence:
        one: 1 more comment that Hub cannot show here
        other: "%{count} more comments that Hub cannot show here"
      other_contradictions:
        one: 1 more opposing comment that Hub cannot show here
        other: "%{count} more opposing comments that Hub cannot show here"
      accept: Accept
      edit: Edit and accept
      content_label: Wording agents get
      accept_edited: Accept with this wording
      reject: Reject
      reject_reason: Why reject this suggestion?
      confirm_reject: Reject suggestion
      cancel: Cancel
    accepted:
      heading: Accepted learnings
      empty: No accepted learnings yet.
      accepted_by: "Accepted by @%{login} on %{date}"
      accepted_by_edited: "Accepted by @%{login} on %{date}, with edits"
      recalled: This learning is included in the preview below.
      budget_excluded: This learning is eligible, but the preview's count or text limit leaves it out. An agent's task can change which learnings fit.
      not_recalled: Agents do not get this learning now. Its evidence is unavailable, it was superseded, or it does not apply now.
      damaged: This learning failed the store's integrity checks, so agents do not get it. An operator can run replica-learning verify.
      damaged_content: This learning's wording is unavailable because its stored record failed integrity checks.
      identity_content: This version's wording is withheld until its reviewer identities are revalidated.
      identity_review: Reviewer identities need revalidation, so agents cannot use this version until its evidence is rebuilt and reviewed.
      withheld: The store withholds this learning's wording because its evidence is no longer permitted.
      retire: Retire
      retire_reason: Why retire this learning?
      confirm_retire: Retire learning
      cancel: Cancel
    recall:
      heading: What an agent gets
      description: This preview shows the default learnings within the count and text limits. An agent's task can change their order and which ones fit.
      empty: Agents get nothing yet. Accept a suggestion to share it with agents.
    decisions:
      invalid: Choose a decision and fill in what it needs. Nothing changed.
      failed: "Hub could not record that decision: %{reason}"
      done:
        accept: Accepted. This learning is available to agents.
        reject: Rejected. Hub suggests it again only if more reviewers raise it.
        retire: Retired. Agents no longer get this learning.
    load_error: "Hub could not read this repository's learnings: %{reason}"
    identity_notice: Earlier suggestions or accepted learnings need identity revalidation. Hub keeps their history, but agents cannot use those versions. Find learnings again, then review any rebuilt suggestions.
