en:
  sharing_settings:
    heading: Public sharing
    description: Control whether this Hub permits anonymous access to shared prototype Builds. This setting does not grant repository access.
    enabled: Public sharing is enabled
    disabled: Public sharing is disabled
    empty: No public access is permitted until a Hub administrator explicitly enables sharing.
    enable:
      label: Enable public sharing
      consequence: Anyone with a new share link can view its fixed Build without signing in. Previously revoked links stay revoked.
    disable:
      label: Disable public sharing
      consequence: All existing share links will be permanently revoked, including open previews and pending handoffs. Enabling later permits new links only.
    confirm: I understand and confirm this deployment-wide change.
    verification: This change requires GitHub verification within the last five minutes on this browser. If verification is required, Hub continues your confirmed change after it succeeds.
    changed: Public sharing settings changed.
    no_access: Only Hub administrators can view or change deployment sharing settings.
    errors:
      not_authorized: Your account is not a current Hub administrator. No sharing settings changed.
      confirmation_required: Confirm the sharing change explicitly. No sharing settings changed.
      invalid_operation: Choose whether to enable or disable sharing. No sharing settings changed.
      state_changed: Sharing already changed. Review its current state and confirm again.
      save_failed: Sharing settings could not be saved. No sharing settings changed.
