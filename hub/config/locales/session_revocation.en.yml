en:
  session_revocation:
    heading: End all Hub sessions
    description: Sign everyone out of this Hub and disconnect existing Copilot canvas connections. People can sign in and approve new connections afterward.
    scope: Existing browser sessions, canvas access and refresh credentials, pending canvas approvals, preview handoffs, and signed-in preview access will end. Public share links and public previews will not change.
    own_session: "Your own session (@%{login}) will end too. This browser will show the result without requiring another sign-in."
    verification: GitHub must have verified this browser's account within the last five minutes. If verification is required, Hub ends the sessions after it succeeds.
    counts: "%{browsers} browser sessions, %{canvases} canvas connections, and %{pairings} pending approvals. Counts can change before confirmation."
    empty: No other browser sessions, canvas connections, or pending approvals are active. Your own session will still end.
    confirm: I understand this will end everyone's sessions, including my own.
    submit: End all sessions
    cancel: Cancel
    cancelled: Session revocation cancelled. No sessions were ended.
    confirmation_required: Confirm that everyone's sessions will end, including your own. No sessions were ended.
    not_authorized: Only a current Hub administrator can end all sessions. No sessions were ended by this request.
    save_failed: Hub could not end sessions. No authentication changes were saved.
    succeeded: All existing Hub sessions ended
    result: Your session has ended. Existing browser sessions, canvas access and refresh credentials, pending approvals, and signed-in preview handoffs no longer authorize access. Sign in again to continue.
    result_scope: Public share links and public previews have not changed. People can sign in and approve new canvas connections.
    disconnect_failed: Credentials were revoked, but Hub could not deliver every live disconnect. Existing connections cannot authorize new subscriptions or receive review updates; periodic checks also close them. Ask the deployment operator to check the live connection service.
    sign_in: Return to sign-in
