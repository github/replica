en:
  fresh_authorization:
    heading: Fresh GitHub authorization required
    description: Verify the same GitHub account to continue your confirmed action. GitHub may reuse your signed-in browser; this is not a guaranteed password or MFA challenge.
    required: Fresh GitHub authorization is required. No changes were made. Verify your account, then submit the action again.
    submit: Verify with GitHub
    cancel: Cancel
    cancelled: Authorization cancelled. No sensitive changes were made.
    failure: GitHub authorization failed, expired, or used a different account. No sensitive changes were made. Return to the original action to try again.
    succeeded: GitHub authorization succeeded for this connection only. Return to the action and submit it again within five minutes.
    continuing_heading: Completing your action
    continuing_description: GitHub verified your account. Hub is continuing the action you confirmed. If it does not continue automatically, choose Continue.
    continue: Continue
    continuation_failed: Hub could not continue this action. It may have expired or already been attempted. Review its current state before trying again.
