en:
  hub_admins:
    heading: Hub administrators
    description: Hub administrators can manage this deployment and read its security records. This role never grants access to GitHub repositories.
    empty: No Hub administrators are available.
    no_admin_access: Your GitHub repository permissions are unchanged. Hub administrator controls and deployment security records are not available to this account.
    next: Next page
    add: Add administrator
    count:
      one: "%{count} administrator"
      other: "%{count} administrators"
    added: Selected users were added as Hub administrators.
    add_dialog:
      heading: Add administrator
      description: Select existing Hub users to give them administrator controls and access to deployment security records. Their GitHub repository permissions will not change.
      search: Search Hub users
      search_placeholder: Search by name or login
      loading: Searching Hub users…
      empty: No matching Hub users are available.
      more: Showing the first 50 matches. Refine your search to find other users.
      selected: Selected users
      confirm: I confirm adding the selected users as Hub administrators.
      submit: Add selected administrators
      search_failed: Hub could not search users. Try again. No role changes were made.
      retry: Try again
    audit: Security audit
    repositories: Repositories
    admin: Hub administrator
    user: Hub user
    designate: Designate administrator
    revoke: Remove administrator
    changed: Hub administrator role changed.
    cancel: Cancel
    confirm: I confirm this Hub administrator role change.
    verification: A role change requires GitHub to have verified this browser's account within the last five minutes. If verification is required, Hub continues your confirmed change after it succeeds.
    identity: "GitHub identity %{github_id} - Hub user %{id}"
    confirmation:
      designate:
        heading: Designate Hub administrator?
        description: This user will be able to designate and remove Hub administrators and read deployment security records. Their GitHub repository permissions will not change.
      revoke:
        heading: Remove Hub administrator?
        description: This user will lose Hub administrator controls and deployment security records. Their GitHub repository permissions will not change. Removing your own role takes effect immediately.
    errors:
      not_authorized: Your account is no longer a Hub administrator. No role changes were made.
      confirmation_required: Confirm the requested role change before submitting. No role changes were made.
      invalid_operation: Choose designation or removal. No role changes were made.
      invalid_target: This existing Hub user is no longer available. No role changes were made.
      invalid_selection: Select between 1 and 50 distinct existing Hub users. No role changes were made.
      role_changed: This user's role already changed. Review their current role and confirm again. No role changes were made.
      last_admin: The final Hub administrator cannot be removed. Designate another existing Hub user first.
      save_failed: Hub could not save this user's role. No role changes were made.
