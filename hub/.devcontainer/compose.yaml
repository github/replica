services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    init: true
    working_dir: /workspaces/replica/hub
    volumes:
      - ../..:/workspaces/replica:cached
      - postgres-socket:/var/run/postgresql:ro
    environment:
      DATABASE_URL: postgresql://replica:replica@db:5432/replica
      TEST_DATABASE_URL: postgresql://replica:replica@db:5432/postgres
      REPLICA_DEVCONTAINER: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: replica
      POSTGRES_PASSWORD: replica
      POSTGRES_DB: replica
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
      - ./learning-role.sql:/docker-entrypoint-initdb.d/learning-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U replica -d replica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  postgres-socket:
