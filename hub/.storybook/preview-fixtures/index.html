<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome prototype</title>
    <style>
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font-family: system-ui;
      }

      main {
        padding: 4rem;
      }

      button {
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to the prototype</h1>
      <p>Review this design with Octocat and Mona.</p>
      <button id="save">Save</button>
    </main>
    <script>
      const route = { pathname: "/", search: "", hash: "" }
      window.addEventListener("message", ({ data, origin, source }) => {
        if (source !== parent || !data || typeof data.nonce !== "string") return
        const send = (message) => parent.postMessage({ nonce: data.nonce, ...message }, origin)
        if (data.type === "replica:canvas:request-ready")
          send({
            type: "replica:canvas:ready",
            protocolVersion: 1,
            improvementSelection: true,
            route,
          })
        if (data.type === "replica:canvas:resolve" && Array.isArray(data.anchors)) {
          const bounds = document.getElementById("save").getBoundingClientRect()
          const rect = {
            x: bounds.x + window.scrollX,
            y: bounds.y + window.scrollY,
            width: bounds.width,
            height: bounds.height,
          }
          send({
            type: "replica:canvas:resolved",
            protocolVersion: 1,
            route,
            results: data.anchors.map(({ id }) => ({
              id,
              x: rect.x + rect.width / 2,
              y: rect.y + rect.height / 2,
              rect,
            })),
          })
        }
        const button = document.getElementById("save")
        if (data.type === "replica:canvas:cancel-selection") button.onclick = null
        if (data.type === "replica:canvas:select" && data.mode === "improvement")
          button.onclick = () => {
            const bounds = button.getBoundingClientRect()
            send({
              type: "replica:canvas:selected",
              anchor: {
                schemaVersion: 1,
                kind: "element",
                route,
                selector: "#save",
                accessibleName: "Save",
                tagName: "button",
                selectedText: "",
                rect: { x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height },
                viewport: {
                  width: innerWidth,
                  height: innerHeight,
                  scrollX,
                  scrollY,
                },
                elementOffset: { x: 0.5, y: 0.5 },
              },
            })
          }
      })
    </script>
  </body>
</html>
