services:
  decision-runtime:
    build:
      context: .
      dockerfile: server/runtime.Dockerfile
    environment:
      REPLICA_RUNTIME_TOKEN: ${REPLICA_RUNTIME_TOKEN:?set REPLICA_RUNTIME_TOKEN}
    command:
      - python
      - -m
      - replica_brand_check.runtime_server
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --environment
      - ${REPLICA_RUNTIME_ENVIRONMENT:-development}
      - --tenant
      - ${REPLICA_RUNTIME_TENANT:-local}
      - --repository
      - ${REPLICA_RUNTIME_REPOSITORY:-local/runtime}
      - --state
      - /data/runtime
    ports:
      - 127.0.0.1:${REPLICA_RUNTIME_PORT:-8010}:8010
    user: ${REPLICA_RUNTIME_USER:-10001:10001}
    volumes:
      - ${REPLICA_RUNTIME_STATE_DIR:?set REPLICA_RUNTIME_STATE_DIR}:/data/runtime
  lifecycle-demo:
    profiles: [demo]
    build:
      context: .
      dockerfile: server/runtime.Dockerfile
    depends_on:
      decision-runtime:
        condition: service_healthy
    environment:
      REPLICA_RUNTIME_TOKEN: ${REPLICA_RUNTIME_TOKEN:?set REPLICA_RUNTIME_TOKEN}
    command:
      - python
      - /app/runtime_deletion_demo.py
      - --url
      - http://decision-runtime:8010
